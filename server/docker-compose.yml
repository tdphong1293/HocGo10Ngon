services:
  mongodb:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: mongodb-HocGo10Ngon
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - hocgo10ngon_mongo_data:/data/db
      - hocgo10ngon_mongo_config:/data/configdb

  postgres:
    image: postgres:17.6-alpine3.22
    container_name: postgres-HocGo10Ngon
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - hocgo10ngon_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.2-alpine3.22
    container_name: redis-HocGo10Ngon
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hocgo10ngon_redis_data:/data

volumes:
  hocgo10ngon_mongo_data:
  hocgo10ngon_mongo_config:
  hocgo10ngon_postgres_data:
  hocgo10ngon_redis_data: