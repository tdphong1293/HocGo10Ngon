name: Server CI/CD

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'server/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Run Tests (NestJS)
        run: npm run test --if-present
        working-directory: ./server

      - name: Build NestJS
        run: npm run build
        working-directory: ./server

  # BƯỚC CD (DEPLOY SERVER)
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server (Ví dụ: Render/Railway/VPS)
        run: echo "Viết lệnh trigger deploy Server vào đây"