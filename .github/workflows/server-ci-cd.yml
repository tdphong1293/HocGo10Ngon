name: Server CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'server/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Run Tests
        run: npm run test --if-present
        working-directory: ./server

      - name: Build Project
        run: npm run build
        working-directory: ./server